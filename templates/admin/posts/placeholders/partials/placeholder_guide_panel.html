<section class="panel placeholder-form-guide">
  <div class="field">
    <label>{{ layout.t("admin.template_usage_example") }}</label>
    <p class="placeholder-example-label">
      {{ layout.t("admin.widgets.widget_type") }} <strong>{{ widget_type_label }}</strong>{% if guide_show_name %} {{ layout.t("admin.posts.placeholder_name") }} <strong><code>{{ name }}</code></strong>{% endif %}
    </p>
    <pre class="placeholder-example">{{ template_example }}</pre>
    <p class="help">{{ template_help|safe }}</p>
  </div>
</section>
