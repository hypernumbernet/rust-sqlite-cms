<div class="field">
  <label for="name">{{ layout.t("admin.posts.placeholder_name_2") }}</label>
  <input id="name" name="name" type="text" value="{{ name }}" required pattern="[A-Za-z_][A-Za-z0-9_]*">
  <p class="help">{{ layout.t("admin.identifier_starting_with_a_letter_or_underscore_e_g") }} <code>news</code>）。</p>
</div>

<div class="field">
  <label for="widget_type_id">{{ layout.t("admin.widgets.widget_type_2") }}</label>
  <select id="widget_type_id" name="widget_type_id" required>
    {% for widget_type in widget_types %}
    <option value="{{ widget_type.id }}"{% if widget_type.selected %} selected{% endif %}>{{ widget_type.label }}</option>
    {% endfor %}
  </select>
  <p class="help">{{ layout.t("admin.widgets.widget_appearance_html_is") }} <a href="/admin/widgets">{{ layout.t("nav.widgets") }}</a> {{ layout.t("admin.edit_in_the_ui") }}</p>
</div>
